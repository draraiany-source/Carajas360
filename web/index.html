<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carajás 360</title>
  <meta name="description" content="Carajás 360: serviços, saúde, locação e mercado da sua região.">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png"/>
  <link rel="manifest" href="manifest.json">
  <style>
    body { background: linear-gradient(135deg,#0D47A1,#0A3880,#2E7D32); margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:sans-serif; }
    #loading { text-align:center; color:#fff; }
    .spinner { width:36px; height:36px; border:3px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; margin:20px auto; }
    @keyframes spin { to { transform:rotate(360deg) } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="favicon.png" width="88" height="88" alt="Carajás 360" style="border-radius:22px"/>
    <h1>Carajás 360</h1>
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
