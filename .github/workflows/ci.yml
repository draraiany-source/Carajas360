name: CI

on:
  pull_request:
  push:
    branches: [main, 'cursor/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Functions lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Erros (ex.: tipo inexistente) falham o job. Infos/warnings
      # pré-existentes (withOpacity, curly braces) não bloqueiam.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  # Auditoria estática das rules (sem emulador / sem Java).
  # Emulador @firebase/rules-unit-testing → BLOCO E (precisa da Raiany no CI).
  rules_audit:
    name: Firestore rules audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test firestoreRules.audit.js
